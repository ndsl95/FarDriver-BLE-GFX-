<line x1="97.65" y1="130.50" x2="106.31" y2="135.50" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
<line x1="88.50" y1="139.65" x2="93.50" y2="148.31" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
<line x1="76.00" y1="143.00" x2="76.00" y2="153.00" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
<line x1="63.50" y1="139.65" x2="58.50" y2="148.31" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
<line x1="54.35" y1="130.50" x2="45.69" y2="135.50" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
<line x1="51.00" y1="118.00" x2="41.00" y2="118.00" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
<line x1="54.35" y1="105.50" x2="45.69" y2="100.50" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
<line x1="63.50" y1="96.35" x2="58.50" y2="87.69" stroke="#2c4242" stroke-width="4" stroke-linecap="round"/>
</g>
<text x="206" y="107" fill="#f4f8f6" font-size="13" text-anchor="middle">正在查找控制器</text>
<text x="206" y="129" fill="#97a7ad" font-size="11" text-anchor="middle">扫描约需五秒</text>
<text x="206" y="150" fill="#97a7ad" font-size="10" text-anchor="middle">请保持控制器通电</text>
<g><rect x="64" y="202" width="192" height="30" rx="7" fill="#121d1b" stroke="#29dce6" stroke-width=".7"/><text x="160.0" y="221.0" fill="#29dce6" font-size="11" text-anchor="middle">停止扫描</text></g>
