<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 320 240"><title>横屏蓝牙搜索页参考</title><desc>320×240 横屏中文蓝牙搜索页面设计示意，左侧扫描指示，右侧状态说明，底部停止扫描按钮。</desc>
<style>
text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
.num { font-family: "Consolas", "DejaVu Sans Mono", monospace; font-weight:600; }
.label { fill:#97a7ad; font-size:10px; }
</style>
