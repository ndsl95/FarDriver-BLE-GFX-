; ============================================================
;  FarDriver_BLE_GFX - PlatformIO 适配 (Arduino IDE 工程原地迁移)
;  板卡: ES3C28P (ESP32-S3 N16R8: 16MB Flash + 8MB OPI PSRAM)
; ============================================================
[platformio]
src_dir = .
; Xtensa GCC 14.x 的 Windows 链接器不能创建含中文路径的 firmware.map。
; 源码仍位于当前工程，仅将临时编译产物放到纯英文用户目录。
build_dir = C:/Users/60553/.platformio/build/FarDriver_BLE_GFX

[env:es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ---- ESP32-S3 N16R8: 16MB Flash + 8MB OPI PSRAM ----
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1

; ---- 源码位于项目根目录 (Arduino IDE 布局) ----
build_src_filter = +<*> -<.pio> -<.git> -<include> -<ui_gfx.cpp>

; ---- 库依赖 ----
; TFT_eSPI: 引脚配置经 include/User_Setup.h -> include/Setup400_EKSR.h 注入
; NimBLE:   ESP32 Arduino 内核自带, 无需单独声明
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^2.3.6
