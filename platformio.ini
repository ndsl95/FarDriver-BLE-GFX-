; ============================================================
;  FarDriver_BLE_GFX - PlatformIO 适配 (Arduino IDE 工程原地迁移)
;  板卡: ES3C28P (ESP32-S3 N16R8: 16MB Flash + 8MB OPI PSRAM)
; ============================================================
[platformio]
src_dir = .
; 编译产物默认放在本工程 .pio/ 下 (已被 .gitignore 忽略)。
; 仅当工程路径含中文时可以改为纯英文绝对路径, 例如:
;   build_dir = C:/pio-build/FarDriver_BLE_GFX
; (Xtensa GCC 14.x 的 Windows 链接器无法创建含中文路径的 firmware.map)

[env:es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ---- ESP32-S3 N16R8: 16MB Flash + 8MB OPI PSRAM ----
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    ; ============================================================
    ;  TFT_eSPI 屏参 (ES3C28P: ILI9341V 240x320)
    ;  引脚来源见 Setup400_EKSR.h
    ;
    ;  TFT_eSPI 2.5.43 的 User_Setup_Select.h 带 #ifndef USER_SETUP_LOADED
    ;  保护, 定义该宏后库会跳过自带的 User_Setup.h, 屏参完全由这里注入。
    ;  这样就不必再去覆盖 .pio/libdeps/.../TFT_eSPI/User_Setup.h
    ;  (旧 README 记录的"覆盖库文件"办法会随依赖重装而丢失)。
    ; ============================================================
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=10
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; ESP32-S3 开 OPI PSRAM 后 TFT 必须走 SPI3 (HSPI),
    ; 否则与 FSPI (SPI2) + OPI PSRAM 冲突导致 StoreProhibited
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=6000000
    -DSPI_TOUCH_FREQUENCY=2500000

; ---- 源码位于项目根目录 (Arduino IDE 布局) ----
build_src_filter = +<*> -<.pio> -<.git> -<include> -<ui_gfx.cpp>

; ---- 库依赖 ----
; TFT_eSPI: 屏参经 build_flags 注入, 无需修改库文件
; NimBLE:   ESP32 Arduino 内核自带, 无需单独声明
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^2.3.6
